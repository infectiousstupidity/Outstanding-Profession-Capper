name: Validate addon

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Check Lua syntax
        run: find . -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
      - name: Test character skill context
        run: lua5.1 tools/test_character_skill.lua
      - name: Test recommendation settings migration
        run: lua5.1 tools/test_settings.lua
      - name: Test performance instrumentation
        run: lua5.1 tools/test_performance.lua
      - name: Test profession book lifecycle
        run: lua5.1 tools/test_profession_book.lua
      - name: Test refresh event coalescing
        run: lua5.1 tools/test_refresh_coordinator.lua
      - name: Test revisioned runtime caches
        run: lua5.1 tools/test_runtime_caches.lua
      - name: Test recipe difficulty metadata
        run: lua5.1 tools/test_recipe_difficulty.lua
      - name: Verify generated route topology
        run: python3 tools/generate_route_data.py --check
      - name: Test generated route topology
        run: lua5.1 tools/test_route_data.lua
      - name: Test bundled recipe catalog
        run: lua5.1 tools/test_recipe_catalog.lua
      - name: Verify generated enchant scroll metadata
        run: python3 tools/generate_enchant_scroll_metadata.py --check
      - name: Test enchant scroll metadata
        run: lua5.1 tools/test_enchant_scroll_metadata.lua
      - name: Test recipe acquisition model
        run: lua5.1 tools/test_recipe_acquisition.lua
      - name: Test recipe source locations
        run: lua5.1 tools/test_recipe_source_locations.lua
      - name: Test price provider abstraction
        run: lua5.1 tools/test_price_provider.lua
      - name: Test conservative resale valuation
        run: lua5.1 tools/test_resale_value.lua
      - name: Test TSM AuctionDB provider
        run: lua5.1 tools/test_tsm_price_provider.lua
      - name: Test recipe cost engine
        run: lua5.1 tools/test_recipe_cost.lua
      - name: Test cheapest route solver
        run: lua5.1 tools/test_route_solver.lua
      - name: Test incremental route execution
        run: lua5.1 tools/test_incremental_route.lua
      - name: Test total cost and shopping plan
        run: lua5.1 tools/test_shopping_plan.lua
      - name: Test dynamic recommendation integration
        run: lua5.1 tools/test_dynamic_recommendations.lua
      - name: Test incremental recommendations
        run: lua5.1 tools/test_incremental_recommendations.lua
      - name: Test full-catalog adaptive routes
        run: lua5.1 tools/test_full_catalog_routes.lua
      - name: Test static full route
        run: lua5.1 tools/test_static_route.lua
      - name: Test craft sessions
        run: lua5.1 tools/test_session.lua
      - name: Test enchant replacement confirmation
        run: lua5.1 tools/test_enchant_confirmation.lua
      - name: Test Enchanting rod ownership
        run: lua5.1 tools/test_enchanting_rods.lua
      - name: Validate Phase 7 performance guards
        run: python3 tools/validate_phase7_guards.py
      - name: Validate addon structure
        run: python3 tools/validate_addon.py
      - name: Validate profession guides
        run: python3 tools/validate_guides.py
